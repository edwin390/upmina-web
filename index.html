<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var p = localStorage.getItem("upmina:theme");
          var light =
            p === "light" ||
            (p !== "dark" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          var r = document.documentElement;
          r.setAttribute("data-theme", light ? "light" : "dark");
          r.classList.toggle("dark", !light);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96.png?v=2" />
    <link rel="apple-touch-icon" href="/images/favicon-180.png?v=2" />
    <meta name="theme-color" content="#0B0D13" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <meta
      name="description"
      content="Fan site no oficial de UPMINAA: directos, YouTube, Instagram, TikTok y comunidad de edits."
    />
    <title>UPMINAA — Fan Site</title>
  </head>
  <body class="bg-bg-base text-text-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
